/* Ver.13 — the book remains readable during every effect. */
body{overflow-x:clip;transition:background .65s ease}
body[data-scene="challenge"]{background:#bfb7ad}
body[data-scene="memory"],body[data-scene="ending"]{background:#e6d5bb}
header,.controls,.hint{position:relative;z-index:32}.side-nav{z-index:33}
.stage{z-index:2;isolation:isolate}.book{z-index:2}

/* Ordinary text stays readable immediately; only selected phrases move. */
.appear .page-body>*{animation:none}
.appear .question{animation:dialogueIn .28s both;animation-delay:calc(var(--q,0)*.045s)}
.appear .kinetic.reject strong{animation:inkCut .26s both}
.appear .kinetic.reject .stamp{animation:stampDrop .28s .16s both}

.appear .kinetic.challenge:after{height:2px;animation:lineDraw .42s .08s both}

.appear .kinetic.memory .paper-word{animation:ink .4s both}
.appear .kinetic.memory:before{animation:lightSweep .95s both}
.appear .special-body>p{animation:ink .4s both}
.appear .special-body .thanks{animation:ink .65s .1s both}
.cover.enter h1{animation:coverInk .48s both}.cover.enter .recipient{animation:ink .35s .08s both}.cover.enter .sig{animation:ink .35s both}
.cover .seal{animation:stampDrop .35s .18s both}

#cinema .edge-trace{position:absolute;left:calc(var(--paper-x) - 5px);top:calc(var(--paper-y) - 5px);width:calc(var(--paper-w) + 10px);height:calc(var(--paper-h) + 10px);border:1px solid var(--fx);border-radius:3px;box-shadow:0 0 14px color-mix(in srgb,var(--fx) 38%,transparent);animation:traceFade 1.9s ease both}

/* Ver.17 — a different cinematic grammar for each beat; effects remain behind the book. */
#cinema .fx-vector{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
#cinema .fx-vector path{fill:none;stroke:var(--fx);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw17 2.25s var(--d,0s) ease both}

/* Ver.19 — ceremonial certificate / opening overture */
.cover{container-type:inline-size;background:radial-gradient(ellipse at 50% 36%,#fffdf6 0%,#faf8ef 66%,#f4eddf 100%);padding:0;box-shadow:0 0 0 1px #e7d8b7 inset,0 22px 65px #342d2430,4px 5px 0 #d8cfc0;border-color:#bca87c;}

.cert-frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.cover-inner{padding:8.5% 11%;height:100%;width:100%;}.cover small{font-size:clamp(9px,2.6cqw,12px);margin-top:2%;margin-right:1%;letter-spacing:.14em}.cert-heading{text-align:center;align-self:center;width:100%;margin-top:-5%;}.cert-crest{width:48%;height:auto;display:block;margin:0 auto 7%;}.cover h1{font-size:clamp(27px,12.2cqw,61px);letter-spacing:.18em;padding-left:.18em;margin:0 0 5%;font-weight:600;color:#29251f;text-shadow:none;line-height:1.4}.cert-rule{display:flex;justify-content:center;align-items:center;gap:7px;margin:0 auto 8%;width:65%;}.cert-rule:before,.cert-rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#b08a45)}.cert-rule:after{transform:scaleX(-1)}.cert-rule i{display:block;width:5px;height:5px;background:#b08a45;transform:rotate(45deg)}.cover .recipient{font-size:clamp(12px,4.0cqw,19px);letter-spacing:.08em;line-height:1.65;white-space:normal;color:#39332b}.cover .open-note{align-self:center;justify-content:center;width:max-content;max-width:100%;font-size:clamp(10px,2.8cqw,13px);border:0;border-bottom:1px solid #b08a45;padding:0 4px 8px;margin:0 auto 3%;color:#66502b}.cover .sig{font-size:clamp(10px,3.1cqw,15px);line-height:1.65;margin-right:1%;margin-bottom:1%}.cover .seal{font-size:clamp(10px,3.2cqw,15px);margin-left:7px}.cover.enter .cert-frame{animation:frameArrival .85s ease both}.cover.enter .cert-crest{animation:crestArrival .85s .06s both}.cover.enter h1{animation:coverInk .72s .12s both}.cover.enter .cert-rule{animation:crestArrival .7s .2s both}.cover.enter .recipient{animation:ink .45s .26s both}.cert-final .cert-heading{margin-top:0}.cert-final .cert-crest{width:39%;margin-bottom:4%}

#opening-ceremony{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;visibility:hidden}#opening-ceremony.active{visibility:visible}#opening-ceremony .ceremony-wash{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 35%,#c2974d26 70%,#b58c4438 100%);animation:ceremonyWash 1.65s ease both}#opening-ceremony .ceremony-ring{position:absolute;left:50%;top:50%;width:var(--ring-w);height:var(--ring-h);border:1px solid #b18a44;border-radius:4px;box-shadow:0 0 10px #d6b56b80;animation:ceremonyRing 1.45s var(--delay) cubic-bezier(.15,.65,.25,1) both}#opening-ceremony .ceremony-ray{position:absolute;left:50%;top:50%;width:clamp(65px,18vw,280px);height:1px;background:linear-gradient(90deg,#fff0ba00,#b58b45,#fff0ba00);transform-origin:0 50%;animation:ceremonyRay 1.45s var(--delay) ease-out both}#opening-ceremony .ceremony-spark{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);background:#fff1c1;border:1px solid #b28a43;box-shadow:0 0 9px #d7af55;animation:ceremonySpark 1.55s var(--delay) ease-out both}#opening-ceremony .ceremony-edge{position:absolute;inset:0;border:2px solid #b38b45;animation:ceremonyWash 1.55s ease both}

/* Ver.21: literary jacket and an independently typeset certificate */

.jacket-mark{width:clamp(28px,12cqw,65px);height:2px;background:#d0b37a;display:block}

/* Ver.28 — stable typography: clip a flat sheet, not the glyphs. */
.book .flap{transform-style:flat;perspective:none;overflow:hidden;will-change:clip-path;}

const chapters=[{"heading":"01　まえがき","blocks":["<p class=\"\">20日に行われた飲み会の帰り道。</p>","<p class=\"\">私はすっかりエモエモな感情に駆られまして、何か私なりに、形に残るものをみなさんにお送りできないかと考えていました。</p>","<p class=\"\">そして、帰りの電車の中、酔っ払いながら制作した結果、見事なまでの</p>","<div class=\"stamp-block\"><strong>激キモポエム</strong><span class=\"stamp\">没</span></div>","<p class=\"\">が完成しました。</p>","<p class=\"lead\">もちろん、没です。</p>","<p class=\"\">しかし、修了式後に「なんで没にしちゃったの」という、ありがたいお言葉をいただきまして、こうして改めて作り直すことにしました。</p>","<p class=\"\">本編は、みなさんと過ごした日々ですので、今回は私なりのあとがきだけを残そうと思います。</p>","<p class=\"\">恥ずかしいですが、少しお付き合いください。</p>"],"keep":[[2,6],[7,9]]},{"heading":"02　始まり","blocks":["<p class=\"lead\">さて、入学当初は不安しかありませんでしたね。</p>","<p class=\"\">前職を辞め、自分の中では一度、社会から「お前は社不（社会不適合者）だ。」というレッテルを貼られたような気がして、悩みに悩んでいた時期でした。</p>","<p class=\"\">いっそ、消えてしまえば楽なのにと、何度も考えたこともありました。</p>","<p class=\"\">ありがたいことに、私は家族や周りの人たちに恵まれていたので、職業訓練に通うという選択（まだ生きる）ができました。</p>","<p class=\"\">とはいえ、不安も不安。</p>","<p class=\"\">私にできるの？<br/>クラスメートと馴染めるの？<br/>また、しんどいってならんかな？</p>","<p class=\"\">そんなことばかり考えていました。</p>","<p class=\"\">冒頭から重たいですね、すみません。</p>","<p class=\"\">こっから明るくなるはずなんで、少し耐えてくださいね。</p>"],"keep":[[4,7],[7,9]]},{"heading":"03　試行錯誤","blocks":["<p class=\"\">そんな感情や想いを抱えたまま、私の職業訓練生活がスタートしました。</p>","<p class=\"\">最初はイラレもフォトショも、</p>","<p class=\"question\">なんやこれ？</p>","<p class=\"question\">私、絵描けないよ？</p>","<p class=\"question\">みんなうまくね？</p>","<p class=\"question\">先生、ちょっと何言ってるんですか？</p>","<p class=\"question\">これってこう？　あってる？</p>","<p class=\"\">と、試行錯誤の連続でした。</p>","<p class=\"\">分からないことだらけでしたが、その分、毎日が発見の連続でもありました。</p>","<p class=\"\">今振り返っても、イラレとフォトショでは、みなさんには勝てないなと思いますね。</p>","<p class=\"aside\">（そもそも勝ち負けとかないけどね。）</p>","<p class=\"lead\">だって、みなさんセンス凄すぎましたもん。</p>","<p class=\"\">私が得意としていたのは、世界観や届けたいものの中身を構想すること。</p>","<p class=\"\">頭の中には作りたいものがあるのに、それを思い描いた通りに出力できない。そんな私からすると、みなさんの作品には驚かされることばかりでした。</p>","<p class=\"\">Web版ポートフォリオを作っているときなんかも、みなさんの過去の作品を見て、</p>","<p class=\"lead\">「こんなん作ってたの？　まじ？」</p>","<p class=\"\">ってなりましたもん。</p>"],"keep":[[1,8],[9,11],[14,17]]},{"heading":"04　無我夢中","blocks":["<p class=\"lead\">動画からは、勝ったなと思いましたね。</p>","<p class=\"aside\">（勝ち負けとかないって言ったばかりですけどね。）</p>","<p class=\"emphasis\">ぜってー負けねえ。</p>","<p class=\"\">そんなことを思いながら、学校でも作業し、家でも作業し、少しでもいいものを作ろうと必死でした。</p>","<p class=\"lead\">この時は、ほんっとうに努力しました。<br><span class=\"normal-weight\">今よりも寝てなかったですね（笑）。</span></p>","<p class=\"\">とはいえ、何もかもが手探りでした。</p>","<p class=\"\">ソフトの基本操作から、動画の素材探し、どう表現すればいいのか、そもそも受け手に何を伝えたいのか。</p>","<p class=\"lead\">作っては直し、また作っては直し。</p>","<p class=\"\">無我夢中でしたね。</p>","<p class=\"\">当時は楽しいかどうかを考える余裕すらなかったように思います。</p>","<p class=\"\">今になって振り返ると、</p>","<p class=\"emphasis\">随分と楽しい時間を過ごしていたんだなと思います。</p>","<p class=\"\">そして、その時に学んだことを活かして制作しているのが、こちらのキモポエムです。</p>","<p class=\"aside\">半年間の集大成がこれでいいのかという疑問は、一旦置いておきましょう。</p>"],"keep":[[0,3],[7,9],[10,12],[12,14]]},{"heading":"05　感謝","blocks":["<p class=\"\">さて、自分語りが長々となってしまいました。</p>","<p class=\"\">要は、こんな気持ちで学校に通っていました、ということを伝えたかっただけです。</p>","<p class=\"\">ここまで読んでくださったみなさん、ありがとうございます。</p>","<p class=\"lead\">こっからが本編といえば本編です。</p>","<p class=\"\">あとがきに本編があるのも、おかしな話ですけどね。</p>","<p class=\"aside\">（こっからもっとキモくなるので、あんまり読んでほしくないですけどね。）</p>"],"keep":[[3,6]]},{"heading":"06　越智先生、竹川先生へ","blocks":["<h2>越智先生、竹川先生へ</h2>","<p class=\"\">何度も何度もお伝えしておりますが、本当に半年間ありがとうございました。</p>","<p class=\"\">お二方がクラスの雰囲気を作り、時には緩く、時には厳しく、絶妙な塩梅で接してくださったおかげで、私も余計なストレスを感じることなく学べました。</p>","<p class=\"\">私にとってお二人は、先生であり、話し相手でもありました。</p>","<p class=\"\">頭の中にある漠然としたアイデアや感性を、言葉にするところからお付き合いいただきましたね。自分でも何を言っているのか分からなくなるような話を、随分と聞いていただいた気がします。</p>","<p class=\"parallel\">越智先生は、課題という形で。<br>竹川先生は、寄り添うという形で。</p>","<p class=\"\">お二人それぞれの感性で、私の考えを肯定し、より良いものへと導いてくださいました。</p>","<p class=\"lead\">自分の持っているものは、間違っていないんだなと。</p>","<p class=\"\">そう思えたことが、アイデアを形にする原動力になっていました。</p>","<p class=\"\">もちろん、良いところだけでなく、悪いところもきちんと評価してくださったことにも感謝しています。</p>","<p class=\"\">何より、こんな私の努力をちゃんと見てくださっていたことが、本当に嬉しかったです。</p>","<p class=\"\">アイデアを考えることは、昔から好きでした。</p>","<p class=\"\">ですが、それを形にして、誰かに見てもらうことがこんなにも楽しいとは知りませんでした。</p>","<p class=\"\">お二人には、随分と作る楽しさを教えていただきましたね。</p>","<p class=\"\">さて、こんなことを言うのも恥ずかしいのですが。</p>","<p class=\"\">これから、もっともっとすごいものを作り続けますので、いつか、どこかで私の作ったものを手に取っていただけたら嬉しいです。</p>","<p class=\"\">その時に、</p>","<div class=\"kinetic mentor\"><p class=\"paper-word\">「やるじゃん。」</p></div>","<p class=\"\">って思っていただけたら、最高ですね。</p>","<p class=\"\">本当に、お二人が先生でよかったです。</p>","<p class=\"\">ありがとうございました。</p>"],"keep":[[0,2],[5,7],[7,9],[11,13],[16,19],[19,21]]},{"heading":"07　一緒に学んだみなさんへ","blocks":["<h2>一緒に学んだみなさんへ</h2>","<p class=\"\">いろんな事情があって、いろんな環境を経験してきた人たちが、同じ場所で、同じ時間と経験を共有し、それぞれに成長していく。</p>","<p class=\"\">私にとってみなさんは、互いに高め合える仲間でした。</p>","<p class=\"\">みなさんの尊敬するところを挙げだしたら、きりがありません。</p>","<p class=\"\">というより、私だけではなく、みなさんが互いにリスペクトを持って接していたからこそ、こんなにいいクラスになったんだと思います。</p>","<p class=\"\">個人的には、みなさんの前では常に最強の私でいたかったですね。</p>","<p class=\"\">みなさんが思う私を、次の作品では超えたろ、なんて思いながら制作していました。</p>","<p class=\"\">随分と自分で自分のハードルを上げていましたね（笑）。</p>","<p class=\"\">作品を見ていただくたびに、</p>","<p class=\"lead\">「まだいけるやろ、俺。」</p>","<p class=\"\">という自信にもなりましたし、</p>","<p class=\"lead\">「あ、この見せ方だと伝わらんねや。」</p>","<p class=\"\">という、自分の表現を見直す基準にもなりました。</p>","<p class=\"\">みなさんがいてくださったからこそ、あれだけ制作に打ち込めたのだと思います。</p>","<div class=\"kinetic together\"><p>そして、何より。</p><p>ひとりじゃないんだなと、ずっとずっと実感できた半年間でした。</p></div>","<p class=\"\">うまくいっているように見える人も、話してみると、意外とそんなことはなくて。</p>","<p class=\"\">ああ、その悩み分かるな、なんて思うこともたくさんありました。</p>","<p class=\"\">授業中も、休憩時間も、飲み会も、くだらない話をしていた時間も。</p>","<p class=\"lead\">今となっては、どれも宝物です。</p>","<p class=\"\">まだ何も成し遂げていない私が言うのもなんですが、いつかインタビューを受けるようなことがあれば、</p>","<div class=\"kinetic interview\"><p class=\"interview-quote\">「あの半年間がなければ、今の私はいませんね。」</p></div>","<p class=\"\">なんて、格好つけて答えたいくらいには、私にとって大切な時間です。</p>","<p class=\"\">まあ、今のところインタビューされる予定なんて一切ないんですけどね。</p>","<p class=\"\">みなさんと同じクラスで、本当によかったです。</p>","<p class=\"\">半年間、本当にありがとうございました。</p>"],"keep":[[0,3],[8,11],[11,13],[17,19],[19,23],[23,25]]},{"heading":"08　結び","blocks":["<p class=\"\">さて、そろそろ、あとがきも終わりにしようと思います。</p>","<p class=\"\">修了したという実感は、正直まだありません。</p>","<p class=\"\">楽しかったという感想も、今になってようやく出てきたくらいですから、寂しさも少し遅れてやってくるのでしょうね。</p>","<p class=\"\">私のエモエモな感情から生まれた、この修了証書ですが。</p>","<p class=\"\">いつか何かの拍子にこれを見返して、</p>","<p class=\"\">「ああ、そんな時間もあったな。」</p>","<p class=\"\">なんて思い出していただけたら嬉しいです。</p>","<p class=\"\">その時に、また頑張ろうかなとか、ひとりじゃないんだなとか、少しでも思っていただけたら、作った甲斐があったというものです。</p>","<p class=\"lead\">どうやら、没にしなくてよかったみたいですね。</p>","<p class=\"\">こんなに長い文章になってしまいましたが、結局のところ、伝えたかったことは一つだけです。</p>","<p class=\"\">最後くらいは、茶化さずに。</p>"],"keep":[[4,7],[9,11]]}];
const book=document.querySelector('#book'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),pos=document.querySelector('#pos'),bar=document.querySelector('#bar'),jump=document.querySelector('#jump'),motion=document.querySelector('#motion'),sidePrev=document.querySelector('#sidePrev'),sideNext=document.querySelector('#sideNext');
let preparedFirst=null;
let pages=[],current=-1,desktop=false,busy=false,enabled=!matchMedia('(prefers-reduced-motion: reduce)').matches,serial=0,cleanup=null,ignoreClickUntil=0;

const cinema=document.querySelector('#cinema');let cinemaTimer=0,cinemaEnd=0;
const ceremony=document.getElementById('opening-ceremony');let ceremonyTimer=0;
function stopCeremony(){clearTimeout(ceremonyTimer);ceremony.className='';ceremony.replaceChildren()}
function openCeremony(rect){if(!enabled||!rect)return;stopCeremony();ceremony.style.setProperty('--ring-w',rect.width+'px');ceremony.style.setProperty('--ring-h',rect.height+'px');const rays=Array.from({length:4},(_,i)=>`<i class="ceremony-ray" style="--angle:${i*90}deg;--delay:${i%4*.035}s"></i>`).join('');const sparks=Array.from({length:8},(_,i)=>{const side=i%4;let x,y;if(side<2){x=side===0?Math.max(8,rect.left*(.2+(i*17%65)/100)):Math.min(innerWidth-8,rect.right+(innerWidth-rect.right)*(.2+(i*17%65)/100));y=innerHeight*(.08+(i*31%84)/100)}else{x=innerWidth*(.04+(i*23%92)/100);y=side===2?Math.max(8,rect.top*.5):Math.min(innerHeight-8,rect.bottom+(innerHeight-rect.bottom)*.5)}return `<i class="ceremony-spark" style="--x:${x}px;--y:${y}px;--dx:${(innerWidth/2-x)*.35}px;--dy:${(innerHeight/2-y)*.35}px;--size:${3+i%4}px;--delay:${i%6*.045}s"></i>`}).join('');ceremony.innerHTML='<div class="ceremony-wash"></div><i class="ceremony-ring" style="--delay:0s"></i><i class="ceremony-ring" style="--delay:.16s"></i>'+rays+sparks+'<div class="ceremony-edge"></div>';ceremony.className='active';ceremonyTimer=setTimeout(stopCeremony,490)}
function clearCinema(){clearTimeout(cinemaTimer);clearTimeout(cinemaEnd);cinema.className='';cinema.replaceChildren()}
function sceneNow(){if(current<0)return '';if(current>=pages.length)return 'seal';if(book.querySelector('.leaf:not(.face):not(.underlay) .special-body'))return 'ending';if(book.querySelector('.leaf:not(.face):not(.underlay) .kinetic.challenge'))return 'challenge';if(book.querySelector('.leaf:not(.face):not(.underlay) .kinetic.reject'))return 'reject';if(book.querySelector('.leaf:not(.face):not(.underlay) .kinetic.memory'))return 'memory';for(const k of ['interview','mentor','together'])if(book.querySelector('.leaf:not(.face):not(.underlay) .kinetic.'+k))return k;if(book.querySelector('.leaf:not(.face):not(.underlay) .resolve-line'))return 'resolve';if(book.querySelector('.leaf:not(.face):not(.underlay) .question'))return 'questions';return ''}

function vectorScene(kind,r){
 const W=innerWidth,H=innerHeight,L=r.left,R=r.right,T=r.top,B=r.bottom,C=(L+R)/2,M=(T+B)/2;
 const q=Math.min(15,Math.max(4,L*.35)),t=Math.max(3,T-q),b=Math.min(H-3,B+q),l=Math.max(3,L-q),rr=Math.min(W-3,R+q);
 const path=(d,cls='',delay=0)=>`<path pathLength="1" d="${d}" class="${cls}" style="--d:${delay}s"/>`;
 let out='';
 if(kind==='reject'){
   out+=path(`M${l} ${T+24} V${t} H${rr} V${T+24} M${rr} ${B-24} V${b} H${l} V${B-24}`);
 }else if(kind==='challenge'){
   for(let i=0;i<3;i++){let y=T+(B-T)*(.25+i*.25);out+=path(`M0 ${y+32} L${l} ${y} M${rr} ${y} L${W} ${y-32}`,i===1?'':'fine',i*.06)}
 }else if(kind==='questions'){
   for(let i=0;i<3;i++){let y=T+(B-T)*(.25+i*.25);out+=path(`M${Math.max(2,l-18)} ${y} H${l} M${rr} ${y} H${Math.min(W-2,rr+18)}`,'fine',i*.11)}
 }else if(kind==='mentor'){
   out+=path(`M0 ${M} H${l} M${rr} ${M} H${W}`,'',0);
 }else if(kind==='resolve'){
   out+=path(`M${l} ${b} H${C-8} l8 -8 l8 8 H${rr}`,'',.1);
 }else if(kind==='together'){
   out+=path(`M0 ${M} H${l} V${b} H${C} M${W} ${M} H${rr} V${b} H${C}`,'gold',.05);
 }
 return `<svg class="fx-vector" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${out}</svg>`;
}
const sceneDurations={reject:1900,challenge:2350,questions:1900,mentor:2350,interview:2400,together:3200,memory:3200,ending:3400,seal:2200,resolve:2400};
function playCinema(kind){if(!enabled||!kind)return;const rect=(book.querySelector('.cover:not(.cover-flip)')||book).getBoundingClientRect();const side=Math.max(0,rect.left),right=Math.max(0,innerWidth-rect.right);for(const [key,val] of Object.entries({'paper-x':rect.left,'paper-y':rect.top,'paper-w':rect.width,'paper-h':rect.height,'side-space':side,'right-space':right}))cinema.style.setProperty('--'+key,val+'px');const motes=Array.from({length:kind==='ending'?16:8},(_,i)=>{const left=i%2===0;const margin=left?side:right;const x=left?margin*(.2+((i*17)%60)/100):innerWidth-margin*(.2+((i*17)%60)/100);return `<i class="mote" style="--x:${x}px;--y:${(i*37+12)%100}%;--size:${3+i%3}px;--delay:${i%5*.055}s"></i>`}).join('');const scenes={mentor:'<div class="margin-type b">やるじゃん。</div>',together:'<div class="ribbon"></div>'+motes,interview:'<div class="interview-frame"></div><div class="quote-mark a">“</div><div class="quote-mark b">”</div>',challenge:'<div class="blade"></div><div class="margin-type a">ぜってー</div><div class="margin-type b">負けねえ。</div>',reject:'<div class="ring"></div><div class="margin-type b">没</div>',questions:'<div class="margin-type a">？</div><div class="margin-type b">？</div>',memory:'<div class="ribbon"></div>',ending:'<div class="ribbon"></div>'+motes,seal:'<div class="edge-trace"></div>'};cinema.innerHTML=(scenes[kind]||'')+vectorScene(kind,rect);cinema.className=kind+' active';cinemaEnd=setTimeout(clearCinema,sceneDurations[kind]||2300)}
function queueCinema(delay=0){clearCinema();const kind=sceneNow();if(enabled&&kind)cinemaTimer=setTimeout(()=>{if(sceneNow()===kind)playCinema(kind)},delay)}

function kinetic(content,kind=''){return `<div class="kinetic ${kind}">${content}</div>`}
// Preserve the exact original wording; animate only selected typography.
for(const ch of chapters){ch.blocks=ch.blocks.map(b=>b.includes('class="stamp-block"')?kinetic(b,'reject'):b.includes('ぜってー負けねえ。')?kinetic('<p class="paper-word"><span class="word-reveal" style="--j:0">ぜってー</span><span class="word-reveal" style="--j:1">負けねえ。</span></p>','challenge'):b.includes('どうやら、没にしなくてよかったみたいですね。')?b.replace('class="lead"','class="lead resolve-line"'):b.includes('随分と楽しい時間を過ごしていたんだなと思います。')?kinetic('<p class="paper-word">随分と楽しい時間を過ごしていたんだなと思います。</p>','memory'):b)}
const coverHTML=last=>last?`<div class="cover school-certificate cert-final"><svg class="certificate-border" viewBox="0 0 210 297" preserveAspectRatio="none" aria-hidden="true"><rect x="8" y="8" width="194" height="281" fill="none" stroke="#a88b51" stroke-width="1.05"/><rect x="11" y="11" width="188" height="275" fill="none" stroke="#c6b382" stroke-width=".45"/><g transform="translate(14 14)" fill="none" stroke="#a88b51" stroke-width=".65"><path d="M0 26V0H26 M3 19V3H19 M0 21Q8 7 23 0 M3 27Q13 13 27 3"/><path d="M5 16Q1 9 9 8Q10 14 5 16ZM9 10Q9 3 16 3Q16 9 9 10ZM15 6Q18 0 23 3Q21 7 15 6Z" fill="#b79a60" stroke="none"/></g><g transform="translate(196 14) scale(-1 1)" fill="none" stroke="#a88b51" stroke-width=".65"><path d="M0 26V0H26 M3 19V3H19 M0 21Q8 7 23 0 M3 27Q13 13 27 3"/><path d="M5 16Q1 9 9 8Q10 14 5 16ZM9 10Q9 3 16 3Q16 9 9 10ZM15 6Q18 0 23 3Q21 7 15 6Z" fill="#b79a60" stroke="none"/></g><g transform="translate(14 283) scale(1 -1)" fill="none" stroke="#a88b51" stroke-width=".65"><path d="M0 26V0H26 M3 19V3H19 M0 21Q8 7 23 0 M3 27Q13 13 27 3"/><path d="M5 16Q1 9 9 8Q10 14 5 16ZM9 10Q9 3 16 3Q16 9 9 10ZM15 6Q18 0 23 3Q21 7 15 6Z" fill="#b79a60" stroke="none"/></g><g transform="translate(196 283) scale(-1 -1)" fill="none" stroke="#a88b51" stroke-width=".65"><path d="M0 26V0H26 M3 19V3H19 M0 21Q8 7 23 0 M3 27Q13 13 27 3"/><path d="M5 16Q1 9 9 8Q10 14 5 16ZM9 10Q9 3 16 3Q16 9 9 10ZM15 6Q18 0 23 3Q21 7 15 6Z" fill="#b79a60" stroke="none"/></g></svg><div class="certificate-layout"><div class="certificate-content"><h1>修了証書</h1><div class="certificate-recipient">出会えたみなさんへ</div><p class="certificate-message">出会えてよかったです。<br>半年間、本当にありがとうございました。</p></div><div class="certificate-signature"><span class="closing-respect">敬具</span><div class="certificate-date">令和八年十一月</div><div class="signature-line"><span class="author-name">三星元汰</span><span class="seal" aria-label="三星之印">三星<br>之印</span></div></div></div></div>`:`<div class="cover literary-cover clickable"><div class="jacket"><div class="jacket-date"><span>あとがき</span><span>二〇二六年十一月</span></div><h1>修了証書</h1><div class="jacket-sub"><span class="jacket-mark"></span><div class="recipient">拝啓<br>出会えたみなさんへ</div><div class="jacket-author">三星元汰</div></div><div class="open-note">頁をひらく</div></div></div>`;
function leaf(page,index,side='',corner=true){const el=document.createElement('div');el.className='leaf '+side;const content=page? page.special?`<div class="special-body"><p>出会えてよかったです。</p>${kinetic('<p class="thanks">半年間、本当にありがとうございました。</p>','memory')}</div>`:(page.typesetHTML||page.blocks.join('')) : '';el.innerHTML=`<div class="running">${page?.heading||'　'}</div><div class="page-body">${content}</div><div class="folio">${page?String(index+1).padStart(2,'0'):'　'}</div>`;if(corner&&page){const b=document.createElement('button');b.className='pagecorner';b.setAttribute('aria-label',side==='left'&&desktop?'前の頁':'次の頁');b.onclick=e=>{e.stopPropagation();turn(side==='left'&&desktop?-1:1)};el.append(b)}return el}
function stopTurn(){if(cleanup){const fn=cleanup;cleanup=null;fn()}busy=false}

// Choose breaks inside the original paragraph's line budget.  No page or paragraph changes.
const typeCanvas=document.createElement('canvas').getContext('2d');
const jaWords=typeof Intl.Segmenter==='function'?new Intl.Segmenter('ja',{granularity:'word'}):null;
function setParagraph(p){
 if(p.children.length||p.matches('.question')||p.closest('.kinetic.challenge,.kinetic.reject'))return;
 const str=p.textContent;if(!str||str.length<12)return;
 const st=getComputedStyle(p),center=st.textAlign==='center'||p.matches('.paper-word,.interview-quote')||!!p.closest('.kinetic');
 const lh=parseFloat(st.lineHeight),n=Math.round(p.getBoundingClientRect().height/lh);if(n<2||n>8)return;
 const indent=center?0:Math.max(0,parseFloat(st.textIndent)||0),w=p.clientWidth-1;
 typeCanvas.font=`${st.fontStyle} ${st.fontWeight} ${st.fontSize} ${st.fontFamily}`;
 if('letterSpacing' in typeCanvas)typeCanvas.letterSpacing=st.letterSpacing==='normal'?'0px':st.letterSpacing;
 const chars=Array.from(str),N=chars.length,fs=parseFloat(st.fontSize),boundaries=new Set([0,N]);
 if(jaWords)for(const seg of jaWords.segment(str))boundaries.add(Array.from(str.slice(0,seg.index+seg.segment.length)).length);
 const prohibitedStart=/^[、。，．！？：；）］｝」』】〉》〕ぁぃぅぇぉっゃゅょァィゥェォッャュョヮー々]/u;
 const prohibitedEnd=/[（［｛「『【〈《〔]$/u;
 const widths=Array.from({length:N},()=>[]);for(let i=0;i<N;i++)for(let j=i+1;j<=N;j++){const z=typeCanvas.measureText(chars.slice(i,j).join('')).width; widths[i][j]=z;if(z>w+fs*2)break;}
 let best=null;const target=center?Math.min(w,typeCanvas.measureText(str).width/n):w;
 const memo=new Map();
 function solve(i,k){if(k===n)return i===N?{cost:0,lines:[]}:null;if(i>=N)return null;const key=i+':'+k;if(memo.has(key))return memo.get(key);let res=null;const cap=w-(k===0?indent:0);
 for(let j=i+1;j<=N;j++){
  const z=widths[i][j];if(z===undefined||z>cap)break;if((j===N)!==(k===n-1))continue;
  const chunk=chars.slice(i,j).join('');if(prohibitedStart.test(chunk)||prohibitedEnd.test(chunk))continue;
  const last=k===n-1;let cost;
  if(center)cost=16*((z-target)/fs)**2;
  else if(last)cost= Math.max(0,Math.min(8,cap/fs*.38)-z/fs)**2*15;
  else cost=((cap-z)/fs)**2*2.8+Math.max(0,(cap-z)/fs-4)**2*10;
  if(j<N){if(!boundaries.has(j))cost+=130; if(/^[ぁぃぅぇぉっゃゅょァィゥェォッャュョー]|^(?:し[、。]|て[、。]|た[、。]|です|でした|ます|ました|なかった|いただ|くださ|てい|てお|てくだ|ろう)/u.test(chars.slice(j).join('')))cost+=60;if(/[、。！？」』）]$/u.test(chunk))cost-=13;else if(/[はがをにでともへやの]$/u.test(chunk))cost-=5;if(/^[はがをにでともへやの]/u.test(chars.slice(j).join('')))cost+=2;}
  const tail=solve(j,k+1);if(tail&&(!res||cost+tail.cost<res.cost))res={cost:cost+tail.cost,lines:[chunk,...tail.lines]};
 }

 best=solve(0,0);
 const intentional=[
 ['そんなことを思いながら、学校でも作業し、','家でも作業し、少しでもいいものを作ろうと','必死でした。'],
 ['当時は楽しいかどうかを考える余裕すら','なかったように思います。'],
 ['随分と楽しい時間を過ごして','いたんだなと思います。'],
 ['そして、その時に学んだことを活かして','制作しているのが、こちらのキモポエムです。'],
 ['半年間の集大成がこれでいいのかという疑問は、','一旦置いておきましょう。'],
 ['ここまで読んでくださったみなさん、','ありがとうございます。'],
 ['あとがきに本編があるのも、','おかしな話ですけどね。'],
 ['（こっからもっとキモくなるので、','あんまり読んでほしくないですけどね。）'],
 ['私にとってお二人は、先生であり、','話し相手でもありました。']
 ];
 const authored=intentional.find(lines=>lines.join('')===str&&lines.length===n&&lines.every((t,i)=>typeCanvas.measureText(t).width<=w-(i===0?indent:0)));
 if(authored)best={lines:authored};if(!best)return;
 const old=p.innerHTML,oldH=p.getBoundingClientRect().height;
 p.classList.add('set-lines');if(center)p.classList.add('set-center');p.style.setProperty('--first-indent',indent+'px');
 p.replaceChildren(...best.lines.map((t,i)=>{const e=document.createElement('span');e.className='set-line';e.textContent=t;if(!center&&i<best.lines.length-1){const gap=(w-(i===0?indent:0)-typeCanvas.measureText(t).width)/Math.max(1,Array.from(t).length-1);e.style.letterSpacing=(Math.max(0,parseFloat(st.letterSpacing)||0)+Math.min(.55,Math.max(0,gap)))+'px'}return e}));
 if(p.getBoundingClientRect().height>oldH+1||[...p.children].some(e=>e.scrollWidth>e.clientWidth+1)){p.innerHTML=old;p.classList.remove('set-lines','set-center');p.style.removeProperty('--first-indent');}
}

function layout(){stopCeremony();clearCinema();const anchor=current>=0&&current<pages.length?pages[current]?.key:null;const wasEnd=current>=pages.length&&pages.length>0;stopTurn();serial++;desktop=innerWidth>760;book.className='book '+(desktop?'spread':'single');book.replaceChildren();const probe=leaf({heading:'計測',blocks:[]},0,'probe',false);book.append(probe);const body=probe.querySelector('.page-body');const result=[];for(let c=0;c<chapters.length;c++){
 const ch=chapters[c],groups=[];let units=[];
 for(let i=0;i<ch.blocks.length;){const keep=ch.keep.find(g=>g[0]===i);const end=keep?keep[1]:i+1;groups.push({start:i,blocks:ch.blocks.slice(i,end)});i=end}
 const flatten=u=>u.flatMap(g=>g.blocks);const fits=u=>{body.innerHTML=flatten(u).join('');return body.scrollHeight<=body.clientHeight};
 const push=()=>{if(units.length){result.push({heading:ch.heading,blocks:flatten(units),units:[...units],key:c+':'+units[0].start,chapter:c});units=[]}};
 for(const g of groups){const parts=fits([g])?[g]:g.blocks.map((b,i)=>({start:g.start+i,blocks:[b]}));for(const part of parts){if(units.length&&!fits([...units,part]))push();units.push(part)}}push();
 // Balance short last pages without separating a protected sequence.
 const tail=result.at(-1),before=result.at(-2);
 if(tail?.chapter===c&&before?.chapter===c&&tail.blocks.length<=2){while(tail.blocks.length<4&&before.units.length>1){const candidate=[before.units.at(-1),...tail.units];if(!fits(candidate))break;tail.units=candidate;before.units.pop();tail.blocks=flatten(tail.units);before.blocks=flatten(before.units);tail.key=c+':'+tail.units[0].start}}
}
for(const pg of result){body.innerHTML=pg.blocks.join('');for(const p of body.querySelectorAll('p'))setParagraph(p);if(body.scrollHeight<=body.clientHeight)pg.typesetHTML=body.innerHTML;}
result.push({heading:'結び',special:true,key:'final',chapter:chapters.length});pages=result;probe.remove();preparedFirst=[leaf(pages[0],0,desktop?'left':'')];if(desktop)preparedFirst.push(leaf(pages[1],1,'right'));if(wasEnd)current=pages.length;else if(anchor){let found=pages.findIndex(p=>p.key===anchor);if(found<0){const [c,n]=anchor.split(':').map(Number);for(let i=pages.length-1;i>=0;i--)if(pages[i].chapter===c&&Number(pages[i].key.split(':')[1])<=n){found=i;break}}current=Math.max(0,found);if(desktop)current-=current%2}else if(current!==-1)current=0;buildJump();render()}
function buildJump(){jump.innerHTML='<option value="-1">表紙</option>'+chapters.map((c,i)=>`<option value="${pages.findIndex(p=>p.chapter===i)}">${c.heading}</option>`).join('')+`<option value="${pages.length-1}">最後の言葉</option><option value="${pages.length}">署名・朱印</option>`}
function render(){book.replaceChildren();const cover=current<0||current>=pages.length;book.className='book '+(desktop?'':'single')+(cover?' cover-mode':' '+(desktop?'spread':''));if(cover){book.innerHTML=coverHTML(current>=pages.length);book.firstElementChild.classList.add('appear','enter');if(current<0)book.firstElementChild.onclick=()=>{if(performance.now()>=ignoreClickUntil)turn(1)}}else{if(current===0&&preparedFirst){book.append(...preparedFirst);preparedFirst=null}else{book.append(leaf(pages[current],current,desktop?'left':''));if(desktop)book.append(leaf(pages[current+1],current+1,'right'))}book.querySelectorAll('.leaf').forEach(e=>{e.classList.add('appear');[...e.querySelector('.page-body').children].forEach((x,i)=>x.style.setProperty('--i',Math.min(i,6)))})}prev.disabled=sidePrev.disabled=current<0;next.disabled=sideNext.disabled=current>=pages.length;next.textContent=current<0?'開く ›':'次の頁 ›';pos.textContent=current<0?'表紙':current>=pages.length?'署名・朱印':`${current+1}${desktop&&current+1<pages.length?'–'+(current+2):''} / ${pages.length}`;bar.style.transform=`scaleX(${Math.max(0,Math.min(1,(current+1)/(pages.length+1)))})`;jump.value=current<0?-1:current>=pages.length?pages.length:pages[current]?.special?pages.length-1:pages.findIndex(p=>p.chapter===pages[current].chapter);document.querySelector('#hint').textContent=desktop?'紙面をクリック、または ← → キーで頁をめくる':'左右にスワイプ、またはボタンで頁をめくる';document.body.classList.toggle('no-motion',!enabled);document.body.dataset.scene=sceneNow()==='seal'?'ending':sceneNow();book.querySelectorAll('.question').forEach((el,i)=>el.style.setProperty('--q',Math.min(i,5)))}
function turn(dir){stopCeremony();clearCinema();if(busy)stopTurn();let old=current;if(old<0&&dir<0||old>=pages.length&&dir>0)return;let target=old<0?0:old>=pages.length?Math.floor((pages.length-1)/(desktop?2:1))*(desktop?2:1):old+dir*(desktop?2:1);target=target<0?-1:Math.min(pages.length,target);if(target===old)return;const oldCover=old<0||old>=pages.length,newCover=target<0||target>=pages.length;let oldVisual=oldCover?book.firstElementChild?.cloneNode(true):null;const oldRect=oldCover?book.firstElementChild?.getBoundingClientRect():null;const openingRect=old<0?oldRect:null;current=target;render();if(!enabled)return;if(openingRect&&dir>0){openCeremony(openingRect);book.classList.add('opening-beat')}busy=true;const token=++serial;book.classList.add('turning');const extras=[];if(oldCover&&oldVisual){oldVisual.classList.remove('enter','appear','clickable');oldVisual.classList.add('cover-flip');if(oldRect){oldVisual.style.width=oldRect.width+'px';oldVisual.style.height=oldRect.height+'px'}if(dir<0)oldVisual.classList.add('backwards');book.append(oldVisual);extras.push(oldVisual)}else if(!newCover){if(desktop){const underidx=old+(dir<0?1:0);const under=leaf(pages[underidx],underidx,dir>0?'left underlay':'right underlay',false);book.append(under);extras.push(under)}const flap=document.createElement('div');flap.className='flap '+(dir>0?'next':'prev');const oldidx=old+(desktop&&dir>0?1:0),newidx=target+(desktop&&dir<0?1:0);flap.append(leaf(pages[oldidx],oldidx,'face front '+(desktop?(dir>0?'right':'left'):''),false),leaf(pages[newidx],newidx,'face back '+(desktop?(dir>0?'left':'right'):''),false));book.append(flap);extras.push(flap)}else{const cover=book.firstElementChild;cover.classList.remove('enter');void cover.offsetWidth;cover.classList.add('enter')}
const finish=()=>{if(token!==serial)return;extras.forEach(e=>e.remove());book.classList.remove('turning');busy=false;cleanup=null};cleanup=finish;setTimeout(finish,550);if(dir>0)queueCinema(openingRect?500:newCover?500:560)}

function syncMotion(){motion.setAttribute('aria-pressed',String(enabled));motion.setAttribute('aria-label',enabled?'演出をオフにする':'演出をオンにする');motion.querySelector('.motion-status').textContent=enabled?'ON':'OFF'}
const tocDialog=document.getElementById('toc-dialog'),tocOpen=document.getElementById('toc-open'),tocList=document.getElementById('toc-list');
tocOpen.onclick=()=>{tocList.replaceChildren();for(const opt of jump.options){const val=Number(opt.value);const btn=document.createElement('button');btn.type='button';const label=document.createElement('span');label.textContent=opt.textContent;const folio=document.createElement('span');folio.className='toc-folio';folio.textContent=val<0?'—':val>=pages.length?'—':String(val+1).padStart(2,'0');btn.append(label,folio);const currentChapter=current<0?val<0:current>=pages.length?val===pages.length:pages[current]?.special?val===pages.length-1:val===Number(jump.value);if(currentChapter)btn.setAttribute('aria-current','true');btn.onclick=()=>{tocDialog.close();jump.value=opt.value;jump.dispatchEvent(new Event('change'));};tocList.append(btn)}tocDialog.showModal();(tocList.querySelector('[aria-current=true]')||tocList.firstElementChild)?.focus()};
document.getElementById('close-toc').onclick=()=>tocDialog.close();tocDialog.addEventListener('click',e=>{if(e.target===tocDialog){const r=tocDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)tocDialog.close()}});

prev.onclick=sidePrev.onclick=()=>turn(-1);next.onclick=sideNext.onclick=()=>turn(1);jump.onchange=()=>{stopCeremony();clearCinema();stopTurn();serial++;current=Number(jump.value);if(desktop&&current>=0&&current<pages.length)current-=current%2;render();queueCinema(0)};motion.onclick=()=>{stopCeremony();clearCinema();stopTurn();enabled=!enabled;syncMotion();serial++;render()};syncMotion();
addEventListener('keydown',e=>{if(document.getElementById('toc-dialog').open)return;if(e.target.matches('select,input,textarea')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();turn(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();turn(-1)}});
let down=null;book.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});book.addEventListener('click',e=>{if(performance.now()<ignoreClickUntil||!desktop||e.target.closest('button,.cover,.flap,.underlay')||!getSelection()?.isCollapsed)return;if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])>9)return;const l=e.target.closest('.leaf');if(l)turn(l.classList.contains('left')?-1:1)});
let touch=null;book.addEventListener('touchstart',e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});book.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.3){ignoreClickUntil=performance.now()+450;turn(dx<0?1:-1)}touch=null},{passive:true});book.addEventListener('touchcancel',()=>{touch=null},{passive:true});let resize;addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(layout,130)});layout();if(document.fonts?.status==='loading')document.fonts.ready.then(()=>{if(current<0&&!busy)layout()});
